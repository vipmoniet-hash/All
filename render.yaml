services:
  - type: web
    name: vanclick-taxi4-marketplace-scale
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/vipmoniet-hash/All
    branch: taxi4-marketplace-scale
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: >-
      cd airport-taxi-pilot && rm -rf app app.tar.xz override.tar.xz && mkdir app && cat payload.00 payload.01 payload.02 payload.03 payload.04 | tr -d '\n\r ' | base64 -d > app.tar.xz && tar -xJf app.tar.xz -C app && cat override.00 override.01 override.02 | tr -d '\n\r ' | base64 -d > override.tar.xz && tar -xJf override.tar.xz -C app && node inspect-marketplace.cjs app && node inject-vanclick-inline.cjs app && test -f app/server.js && test -f app/data/pricing.json
    startCommand: cd airport-taxi-pilot/app && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vanclick-unified-staging-db
          property: connectionString
      - key: TAXI4_DB_POOL_MAX
        value: "20"
      - key: MARKETPLACE_AUTH_REQUIRED
        value: "1"
      - key: UNIFIED_REQUIRE_AUTH
        value: "1"
      - key: UNIFIED_REQUIRE_POSTGRES
        value: "1"
      - key: MARKETPLACE_ALLOW_RESET_DEMO
        value: "0"
      - key: MARKETPLACE_ADMIN_PIN_HASH
        sync: false
      - key: MARKETPLACE_DISPATCH_1_4_PIN_HASH
        sync: false
      - key: MARKETPLACE_DISPATCH_5_6_PIN_HASH
        sync: false
      - key: TAXI4_AUTH_LOGIN_LIMIT_PER_IP
        value: "8"
      - key: TAXI4_AUTH_WINDOW_MS
        value: "600000"

databases:
  - name: vanclick-unified-staging-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: vanclick_unified_staging_db
    user: vanclick_unified_staging_db_user
    ipAllowList: []
