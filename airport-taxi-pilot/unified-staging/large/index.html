<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VanClick Large 5–6 Staging</title><link rel="stylesheet" href="/unified/unified.css"></head><body><header class="top"><a class="brand" href="/unified/"><b>V</b><span><strong>VanClick</strong><small>Large 5–6 staging</small></span></a><div class="langs"><button data-lang="he" class="active">עברית</button><button data-lang="ru">Русский</button></div></header><main class="wrap"><section class="hero"><span class="eyebrow">LARGE 5–6 · SHADOW</span><h1 data-t="title">בדיקת זרימת הזמנה לרכב גדול</h1><p data-t="lead">ההזמנה נשמרת רק בסביבת הבדיקה ואינה נכנסת למוקד הפעיל.</p></section><section class="card"><div class="notice" data-t="notice">זהו staging בלבד. אין שליחה למערכת הייצור.</div><form id="largeForm" class="form"><div class="form-grid"><label><span data-t="direction">כיוון</span><select id="direction"><option value="to" data-t="to">לנתב״ג</option><option value="from" data-t="from">מנתב״ג</option></select></label><label><span data-t="city">עיר / יישוב</span><input id="city" required></label><label><span data-t="tripAt">תאריך ושעה</span><input id="tripAt" type="datetime-local" required></label><label><span data-t="passengers">נוסעים</span><select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label><span data-t="largeBags">מזוודות גדולות</span><input id="largeLuggage" type="number" min="0" value="0"></label><label><span data-t="smallBags">טרולי</span><input id="smallLuggage" type="number" min="0" value="0"></label><label><span data-t="name">שם הלקוח</span><input id="customerName" required></label><label><span data-t="phone">טלפון</span><input id="customerPhone" type="tel" required></label><label><span data-t="pickup">כתובת איסוף מדויקת</span><input id="exactPickup" required></label><label><span data-t="dropoff">כתובת יעד מדויקת</span><input id="exactDropoff" required></label><label id="flightWrap"><span data-t="flight">מספר טיסה באיסוף מהשדה</span><input id="flightNumber"></label></div><label><span data-t="notes">הערות</span><textarea id="notes" rows="3"></textarea></label><div class="actions"><button class="primary" type="submit" data-t="save">שמור הזמנת staging</button><a class="secondary" id="smallSwitch" href="/unified/" data-t="small">עבור ל־1–4</a></div><div id="result"></div></form></section></main><script src="/unified/large/large.js" defer></script></body></html>
