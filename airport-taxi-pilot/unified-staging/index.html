<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f6f5">
<title>VanClick Unified Staging</title><link rel="stylesheet" href="/unified/unified.css">
</head>
<body>
<header class="top"><a class="brand" href="/unified/"><b>V</b><span><strong>VanClick</strong><small data-t="staging">סביבת איחוד</small></span></a><div class="langs"><button data-lang="he" class="active">עברית</button><button data-lang="ru">Русский</button></div></header>
<main class="wrap">
<section class="hero"><span class="eyebrow" data-t="eyebrow">שירות אחד · שני גדלי רכב</span><h1 data-t="title">VanClick אחד — בוחרים את הרכב שמתאים לנסיעה</h1><p data-t="lead">המסלול, התאריך, השעה והכבודה נשמרים בעת מעבר בין 1–4 ל־5–6.</p></section>
<section class="card router"><div class="grid">
<label><span data-t="direction">כיוון</span><select id="direction"><option value="to" data-t="to">לנתב״ג</option><option value="from" data-t="from">מנתב״ג</option></select></label>
<label><span data-t="city">עיר / יישוב</span><input id="city" autocomplete="address-level2"></label>
<label><span data-t="date">תאריך</span><input id="date" type="date"></label><label><span data-t="time">שעה</span><input id="time" type="time"></label>
<label><span data-t="passengers">נוסעים</span><select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
<label><span data-t="largeBags">מזוודות גדולות</span><input id="largeBags" type="number" min="0" max="20" value="0"></label>
<label><span data-t="smallBags">טרולי</span><input id="smallBags" type="number" min="0" max="20" value="0"></label></div>
<div id="recommendation" class="recommendation"></div>
<div class="vehicle-grid"><button id="small" class="vehicle"><span class="tag">1–4</span><strong data-t="smallTitle">מונית רגילה</strong><small data-t="smallText">הזמנה עוברת קודם למנהל/סדרן ורק אחר כך למאגר הנהגים</small></button><button id="large" class="vehicle large"><span class="tag">5–6</span><strong data-t="largeTitle">מונית גדולה</strong><small data-t="largeText">קו נפרד לרכב גדול, בלי ערבוב עם מאגר נהגי 1–4</small></button></div></section>
<section class="card ops"><div><span class="eyebrow" data-t="staff">לצוות בלבד</span><h2 data-t="opsTitle">מרכז ניהול VanClick</h2><p data-t="opsText">מסך אחד שמראה את שתי שורות העבודה בלי לערבב את הלוגיקה שלהן.</p></div><a class="primary" href="/unified/dispatch/" data-t="openOps">פתח מרכז ניהול</a></section>
</main><script src="/unified/unified.js" defer></script></body></html>
